name: Control de Calidad - NestJS Backend (pnpm)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  control-calidad:
    runs-on: ubuntu-latest

    steps:
      - name: Copiando el codigo del repositorio
        uses: actions/checkout@v4

      # 1. Configuramos Node.js primero
      - name: Instalando Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 2. Instalamos pnpm de forma global
      - name: Instalando pnpm
        run: npm install -g pnpm

      # 3. PASO DE SEGURIDAD DEVOPS: 
      # Eliminamos archivos fantasmas de workspace si existen, ya que causan el error en pipelines
      - name: Limpieza preventiva de workspace alternos
        run: rm -f pnpm-workspace.yaml

      # 4. Instalamos las dependencias ignorando bloqueos estrictos de versión de lockfile
      - name: Instalando librerias con pnpm
        run: pnpm install --no-frozen-lockfile

      # 5. Compilamos el backend de NestJS
      - name: Compilando el proyecto (Nest Build)
        run: pnpm build

      # 6. Ejecutamos las pruebas unitarias
      - name: Ejecutando pruebas unitarias
        run: pnpm test
