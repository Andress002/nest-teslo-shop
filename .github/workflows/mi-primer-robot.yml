name: Control de Calidad - NestJS Backend (pnpm)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  control-calidad:
    runs-on: ubuntu-latest

    steps:
      - name: Copiando el codigo del repositorio
        uses: actions/checkout@v4

      # 1. Configuramos Node.js primero (sin caché automática para evitar el bug)
      - name: Instalando Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 2. Instalamos pnpm
      - name: Instalando pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # 3. Instalamos las dependencias
      - name: Instalando librerias con pnpm
        run: pnpm install --frozen-lockfile

      # 4. Compilamos el backend de NestJS
      - name: Compilando el proyecto (Nest Build)
        run: pnpm build

      # 5. Ejecutamos las pruebas unitarias
      - name: Ejecutando pruebas unitarias
        run: pnpm test
