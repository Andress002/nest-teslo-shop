name: Control de Calidad - NestJS Backend (pnpm)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DB_HOST: localhost
  DB_PORT: 5432
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
  DB_NAME: teslo_shop_test
  JWT_SECRET: test_jwt_secret_key_123
  JWT_EXPIRES_IN: 2h
  BCRYPT_SALT_ROUNDS: 10
  PORT: 3005

jobs:
  control-calidad:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teslo_shop_test
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Copiando el codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalando Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Habilitando pnpm via Corepack
        run: corepack enable

      - name: Instalando librerias con pnpm
        run: pnpm install --frozen-lockfile

      - name: Verificando codigo con ESLint
        run: pnpm lint

      - name: Compilando el proyecto (Nest Build)
        run: pnpm build

      - name: Ejecutando pruebas unitarias
        run: pnpm test

      - name: Ejecutando pruebas e2e
        run: pnpm test:e2e
