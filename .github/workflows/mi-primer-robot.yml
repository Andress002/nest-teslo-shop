name: Control de Calidad - NestJS Backend (pnpm)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  control-calidad:
    runs-on: ubuntu-latest

    steps:
      - name: Copiando el codigo del repositorio
        uses: actions/checkout@v4

      # 1. Necesitamos instalar pnpm antes de configurar Node.js
      - name: Instalando pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9 # Ajusta a la versión de pnpm que uses (8 o 9)

      # 2. Configuramos Node.js y le decimos que use la caché de pnpm
      - name: Instalando Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # 3. Instalamos las dependencias usando pnpm de forma estricta (equivalente a npm ci)
      - name: Instalando librerias con pnpm
        run: pnpm install --frozen-lockfile

      # 4. Compilamos el backend de NestJS
      - name: Compilando el proyecto (Nest Build)
        run: pnpm build

      # 5. Ejecutamos las pruebas unitarias
      - name: Ejecutando pruebas unitarias
        run: pnpm test
